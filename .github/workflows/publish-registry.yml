name: Publish to Comfy Registry

on:
  push:
    branches: [main]
    paths: [pyproject.toml]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate without publishing
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: comfy-registry-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the node
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install Comfy CLI
        run: python -m pip install comfy-cli==1.26.0

      - name: Prepare version and patch notes
        shell: python
        run: |
          import os
          import pathlib
          import re
          import tomllib

          project = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))
          version = project["project"]["version"]
          changelog = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          heading = re.search(rf"^## {re.escape(version)}(?:\s|$).*?$", changelog, re.MULTILINE)
          if heading is None:
              raise SystemExit(f"Add patch notes for {version} to CHANGELOG.md before publishing.")
          notes = re.split(r"^## ", changelog[heading.end():], maxsplit=1, flags=re.MULTILINE)[0].strip()
          if not notes:
              raise SystemExit(f"The patch notes for {version} are empty.")
          (pathlib.Path(os.environ["RUNNER_TEMP"]) / "registry-notes.md").write_text(notes, encoding="utf-8")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(f"## Comfy Registry version {version}\n\n{notes}\n")

      - name: Validate the node
        run: |
          comfy --skip-prompt --no-enable-telemetry env
          comfy --skip-prompt --no-enable-telemetry node validate

      - name: Publish the version and patch notes
        if: ${{ !inputs.dry_run }}
        env:
          REGISTRY_ACCESS_TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
        run: |
          if [ -z "$REGISTRY_ACCESS_TOKEN" ]; then
            echo "::error::Add the Comfy Registry publishing key as the REGISTRY_ACCESS_TOKEN repository secret, then run this workflow again."
            exit 1
          fi
          comfy --skip-prompt --no-enable-telemetry node publish \
            --token "$REGISTRY_ACCESS_TOKEN" \
            --changelog-file "$RUNNER_TEMP/registry-notes.md"
