[project]
name = "comfyui-hotswitches"
description = "Two switch nodes for ComfyUI: pick from up to 10 named inputs of any type from one dropdown (only the picked one runs), and toggle a resolution node between an aspect-ratio/megapixel picker, manual width/height, or reading the size of a connected image."
version = "0.2.1"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
    {name = "Brad Girman"},
]

[project.urls]
Repository = "https://github.com/Bloodwolfb/ComfyUI-HotSwitches"
"Bug Tracker" = "https://github.com/Bloodwolfb/ComfyUI-HotSwitches/issues"
# Used by Comfy Registry https://registry.comfy.org

[tool.comfy]
PublisherId = "bloodwolfb"
DisplayName = "ComfyUI-HotSwitches"
Icon = "https://raw.githubusercontent.com/Bloodwolfb/ComfyUI-HotSwitches/refs/heads/main/docs/images/icon.png"
